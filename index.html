<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A heartfelt farewell memory page for the 2022–2026 batch — from strangers to family."
    />
    <title>Farewell 2022–2026 | Milte Rahenge ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Animated star particles background -->
    <div class="particles" id="particles"></div>

    <!-- Page wrapper -->
    <main class="page-wrapper">
      <!-- Glowing card -->
      <div class="card" id="farewell-card">
        <!-- Top badge -->
        <div class="batch-badge">✦ Batch 2022 – 2026 ✦</div>

        <!-- Animated farewell title -->
        <h1 class="farewell-title" id="farewell-title" aria-live="polite">
          Milte Rahenge ❤️
        </h1>

        <!-- Subtitle -->
        <p class="subtitle">
          From strangers to family, this journey will stay forever…
        </p>

        <!-- Divider -->
        <div class="divider">
          <span class="divider-dot"></span>
          <span class="divider-line"></span>
          <span class="divider-dot"></span>
        </div>

        <!-- Video player section -->
        <div class="video-wrapper">
          <div class="video-label">🎬 Our Journey</div>
          <div class="video-container">
            <video
              id="farewell-video"
              autoplay
              loop
              muted
              controls
              playsinline
              preload="metadata"
              aria-label="Farewell memory video for Batch 2022–2026"
            >
              <!-- Replace the src below with your actual video file path -->
              <source
                src="https://res.cloudinary.com/dvoxmysgw/video/upload/video_20260331_150653_izorsj.mp4"
                type="video/mp4"
              />
              <p class="video-fallback">
                Your browser doesn't support HTML5 video.
                <a href="farewell.mp4">Download the video</a> instead.
              </p>
            </video>
          </div>
        </div>

        <!-- Emoji hearts row -->
        <div class="hearts-row" aria-hidden="true">
          <span>🎓</span><span>🕊️</span><span>💫</span><span>🌙</span
          ><span>✨</span>
        </div>
      </div>
      <!-- /card -->

      <!-- Footer -->
      <footer class="footer">
        Made with <span class="heart-pulse">❤️</span> Eyteeh.27 | Barton.bytes |
        Baarton.ites
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
